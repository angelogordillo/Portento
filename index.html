<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portento</title>
  <meta name="description" content="Portento: libros, música y deporte." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #111111;
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 40px 32px 0;
      display: flex;
      justify-content: center;
    }

    .brand {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      color: #111111;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(40px, 6vw, 96px);
    }

    .cat {
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      color: #111111;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .cat:hover { opacity: 0.6; transform: translateY(-4px); }
    .cat:focus-visible { outline: 1px solid #111111; outline-offset: 12px; }

    .cat svg { width: 160px; height: 160px; }

    .cat span {
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .cat svg { width: 112px; height: 112px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">PORTENTO</a>
  </header>

  <main>
    <nav aria-label="Categorías">
      <a class="cat" href="/libros/">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5c3.2-1.4 6.6-1.2 10 1.2 3.4-2.4 6.8-2.6 10-1.2v13.5c-3.2-1.4-6.6-1.2-10 1.2-3.4-2.4-6.8-2.6-10-1.2z"/><path d="M12 6.7v13.5"/></svg>
        <span>Libros</span>
      </a>
      <a class="cat" href="/musica/">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Música</span>
      </a>
      <a class="cat" href="/deporte/">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l2.6 7.2"/><path d="M16 2l-2.6 7.2"/><circle cx="12" cy="15" r="6"/><path d="M12 12.2l0.9 1.8 2 0.3-1.45 1.4 0.35 2-1.8-0.95-1.8 0.95 0.35-2-1.45-1.4 2-0.3z"/></svg>
        <span>Deporte</span>
      </a>
      <a class="cat" href="https://healthyrecord.org" target="_blank" rel="noopener noreferrer">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.2-9.5C1.7 7.2 3.8 4 7 4c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.2 0 5.3 3.2 4.2 6.5C19.5 15.4 12 20 12 20z"/><path d="M3.5 12h4l1.5-3 3 6 1.5-3h7"/></svg>
        <span>Hábitos saludables para organizaciones</span>
      </a>
    </nav>
  </main>
</body>
</html>
