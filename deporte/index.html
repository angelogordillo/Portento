<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deporte | Portento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #111111;
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header { padding: 40px 32px 0; display: flex; justify-content: center; }
    .brand {
      font-size: 15px; font-weight: 500; letter-spacing: 0.42em; padding-left: 0.42em;
      color: #111111; text-decoration: none;
    }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 64px 32px; text-align: center;
    }
    svg { width: 160px; height: 160px; }
    h1 { font-size: 14px; font-weight: 400; letter-spacing: 0.28em; padding-left: 0.28em; text-transform: uppercase; }
    p { font-size: 15px; color: #6b6b6b; }
    .back { font-size: 14px; color: #111111; text-decoration: none; border-bottom: 1px solid #111111; padding-bottom: 2px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">PORTENTO</a>
  </header>
  <main>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l2.6 7.2"/><path d="M16 2l-2.6 7.2"/><circle cx="12" cy="15" r="6"/><path d="M12 12.2l0.9 1.8 2 0.3-1.45 1.4 0.35 2-1.8-0.95-1.8 0.95 0.35-2-1.45-1.4 2-0.3z"/></svg>
    <h1>Deporte</h1>
    <p>Próximamente.</p>
    <a class="back" href="/">Volver</a>
  </main>
</body>
</html>
